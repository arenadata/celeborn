# Publishes Maven artifacts to GitHub Packages (maven.pkg.github.com/arenadata/celeborn)
# when a GitHub Release is published. Deploys:
#   - server: the default reactor (spi, common, client, service, master, worker,
#     lifecycle-manager, cli, openapi-client), Scala 2.13
#   - spark-3.5: celeborn-client-spark-3.5-shaded_2.13
#   - spark-4.2: celeborn-client-spark-4.2-shaded_2.13
#
# The Spark shaded modules build under their upstream major-versioned artifactId
# (celeborn-client-spark-{3,4}-shaded); to keep artifacts distinguishable per Spark
# minor, the jar is re-published under a minor-versioned coordinate via deploy:deploy-file
# (the major coordinate is never pushed). The pom/make-distribution stay unchanged.
#
# Auth reuses the existing `arenadata` server-id (see maven.yml), which matches the pom's
# distributionManagement id.

name: Publish Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: maven
          check-latest: false
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Deploy server artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build/mvn -Pgoogle-mirror -Pjdk-17 -Paws -Pozone clean deploy -DskipTests \
            -DdeployAtEnd=true

  spark:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: spark-3.5
            module: client-spark/spark-3-shaded
            major: celeborn-client-spark-3-shaded
            minor: celeborn-client-spark-3.5-shaded
            scala: "2.13"
          - profile: spark-4.2
            module: client-spark/spark-4-shaded
            major: celeborn-client-spark-4-shaded
            minor: celeborn-client-spark-4.2-shaded
            scala: "2.13"
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: maven
          check-latest: false
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build ${{ matrix.profile }} client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build/mvn -Pgoogle-mirror -P${{ matrix.profile }} -Pjdk-17 clean install -DskipTests \
            -pl ${{ matrix.module }} -am
      - name: Publish ${{ matrix.profile }} client as minor coordinate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `-DforceStdout` prints the version as the last stdout line; take only
          # that line so any diagnostic the mvn wrapper prints can't corrupt it.
          VERSION=$(build/mvn -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n1)
          JAR=${{ matrix.module }}/target/${{ matrix.major }}_${{ matrix.scala }}-${VERSION}.jar
          echo "Publishing ${{ matrix.minor }}_${{ matrix.scala }}:${VERSION} from ${JAR}"
          build/mvn deploy:deploy-file \
            -Dfile="${JAR}" \
            -DgroupId=org.apache.celeborn \
            -DartifactId=${{ matrix.minor }}_${{ matrix.scala }} \
            -Dversion="${VERSION}" \
            -Dpackaging=jar \
            -DgeneratePom=true \
            -DrepositoryId=arenadata \
            -Durl=https://maven.pkg.github.com/arenadata/celeborn
