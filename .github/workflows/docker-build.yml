name: Build and Push Celeborn Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      celeborn_version:
        description: 'Celeborn version override (default: project.version from the pom)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: maven
          check-latest: false
          server-id: arenadata
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve Celeborn version
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [[ -n "${{ github.event.inputs.celeborn_version }}" ]]; then
            VERSION="${{ github.event.inputs.celeborn_version }}"
          else
            VERSION=$(build/mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      # Build the server distribution on the runner. -Paws/-Pozone add S3 + Ozone storage
      # support; the arenadata ozone dependency is resolved through the `arenadata` server
      # configured above (GITHUB_TOKEN). Produces ./dist with the full server layout.
      - name: Build distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/make-distribution.sh -Pgoogle-mirror -Pjdk-17 -Paws -Pozone

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuse docker/Dockerfile unchanged, with the exploded dist/ as the build context.
      - name: Build and push server image to GHCR
        env:
          VERSION: ${{ steps.set_version.outputs.VERSION }}
        run: |
          docker build -f docker/Dockerfile -t "ghcr.io/arenadata/celeborn:${VERSION}" dist
          docker push "ghcr.io/arenadata/celeborn:${VERSION}"
