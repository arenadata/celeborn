suite: Test Celeborn configmap

templates:
  - secret.yaml

release:
  name: celeborn
  namespace: celeborn

tests:
  - it: Should create secret
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
          name: celeborn-conf

  - it: Should have correct data fields
    asserts:
      - exists:
          path: stringData["celeborn-defaults.conf"]
      - exists:
          path: stringData["log4j2.xml"]
      - exists:
          path: stringData["metrics.properties"]
      - exists:
          path: stringData["ratis-log4j.properties"]

  - it: Should include celeborn.master.internal.endpoints key in celeborn-defaults.conf
    asserts:
      - matchRegex:
          path: stringData["celeborn-defaults.conf"]
          pattern: "(?m)^\\s*celeborn\\.master\\.internal\\.endpoints\\s*=.*"

  - it: Should not enable internal port by default
    asserts:
      - notMatchRegex:
          path: stringData["celeborn-defaults.conf"]
          pattern: "(?m)^\\s*celeborn\\.internal\\.port\\.enabled=true"

  - it: Should wire internal ports when `internalPort.enabled` is set
    set:
      internalPort:
        enabled: true
        masterPort: 8097
        workerPort: 8093
    asserts:
      - matchRegex:
          path: stringData["celeborn-defaults.conf"]
          pattern: "(?m)^\\s*celeborn\\.internal\\.port\\.enabled=true"
      - matchRegex:
          path: stringData["celeborn-defaults.conf"]
          pattern: "(?m)^\\s*celeborn\\.master\\.internal\\.port=8097"
      - matchRegex:
          path: stringData["celeborn-defaults.conf"]
          pattern: "(?m)^\\s*celeborn\\.worker\\.internal\\.port=8093"
      - matchRegex:
          path: stringData["celeborn-defaults.conf"]
          pattern: "(?m)^\\s*celeborn\\.master\\.ha\\.node\\.0\\.internal\\.port=8097"
      - matchRegex:
          path: stringData["celeborn-defaults.conf"]
          pattern: "celeborn\\.master\\.internal\\.endpoints = .*:8097"

  - it: Should honor `clusterDomain` in service FQDNs
    set:
      clusterDomain: my.domain.test
    asserts:
      - matchRegex:
          path: stringData["celeborn-defaults.conf"]
          pattern: "celeborn-master-0\\.celeborn-master-svc\\.celeborn\\.svc\\.my\\.domain\\.test"
